name: Run Housing Data Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-agent:
    name: Generate and verify report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e '.[dev,llm]'

      - name: Run offline tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run submission workflow
        run: python scripts/run_submission_pipeline.py --output outputs/github-run

      - name: Show report in workflow summary
        run: cat outputs/github-run/stage4/final_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and audit trail
        uses: actions/upload-artifact@v7
        with:
          name: housing-agent-submission-run
          path: |
            outputs/github-run/
          if-no-files-found: error
          retention-days: 14
