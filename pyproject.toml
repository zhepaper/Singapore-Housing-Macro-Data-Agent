[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-housing-macro-data-agent"
version = "0.1.0"
description = "Auditable public-data workflow for Singapore private non-landed housing indicators"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0"
]

[project.optional-dependencies]
llm = ["langchain-openai>=1.0,<2.0"]
dev = ["jsonschema>=4.23,<5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
